[package]
name = "lore-skills"
description = "Read-only inventory and doctor for coding-agent skill folders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# All three are already in the graph via lore-core and lore-ipc, so this crate
# adds no new dependency to the egress audit (scripts/egress-check.sh).
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
