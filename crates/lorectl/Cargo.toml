[package]
name = "lorectl"
description = "Command-line surface over the Lore archive: a local ledger of coding-agent work."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "lorectl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The archive itself. `lorectl` adds a second surface over the same core the
# desktop shell uses; it must never grow its own copy of archive logic.
lore-core = { path = "../lore-core" }
# `skills ls` and `skills doctor`. Read-only on every skill folder, and covered
# by the same egress audit as this crate.
lore-skills = { path = "../lore-skills" }
# Memory notes in a git vault, behind `lorectl mem`.
lore-memory = { path = "../lore-memory" }
# Argument parsing. `lexopt` is a zero-dependency pull parser, deliberately
# chosen over `clap`: this binary is subject to the same no-network guarantee as
# the archive, and the egress dependency audit (scripts/egress-check.sh) is only
# trivially auditable while the tree stays this small. The cost is a hand-rolled
# `--help`, which is paid in `help.rs`.
lexopt = "0.3"
thiserror = "1"
# `--json` output only. Already in the graph via lore-core; used here so a
# caller-supplied archive path is escaped correctly rather than formatted by
# hand into something that is not valid JSON.
serde_json = "1"
# The IPC DTOs the query functions return. Shared with the desktop app so both
# surfaces describe a session with the same vocabulary.
lore-ipc = { path = "../lore-ipc" }
# `lore_core`'s query functions take `&rusqlite::Connection`, so the type has to
# be nameable here. Already in the graph via lore-core (same version, so no
# second copy is built); the features are lore-core's to choose.
rusqlite = "0.32"
# A proposal's `proposed_at`, the type `lore-memory` names. Already in the graph.
time = "0.3"
# `connect` reads Codex's config.toml. Already in the graph at this version.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# `connect` checks a Codex hook's approval, which Codex keys by a SHA-256 of
# the hook. Already in the graph at this version; hashing only, no IO.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# A pseudo-terminal for the tests that run `mem accept`, `mem retire`, and
# `init --review` as a person would. Already in the graph at this version.
rustix = { version = "1", features = ["pty"] }
