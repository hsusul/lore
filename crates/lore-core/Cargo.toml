[package]
name = "lore-core"
description = "Local-first, git-aware archive core for coding-agent sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Bundled SQLite (compiles the amalgamation with FTS5 enabled) so we never
# depend on a system libsqlite3 and FTS5 is always present.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
serde_json = "1"
# RFC3339 timestamp parsing only (no networking/std feature creep).
time = { version = "0.3", features = ["parsing"] }
# Cross-platform watcher; default macOS backend is FSEvents.
notify = "8.2"

[dev-dependencies]
tempfile = "3"
