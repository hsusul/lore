[package]
name = "lore-core"
description = "Local-first, git-aware archive core for coding-agent sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Shared IPC DTOs (the generated Rust<->TS contract). No Tauri/webview here:
# lore-core produces the wire types from DB queries; the shell serializes them.
lore-ipc = { path = "../lore-ipc" }
# Bundled SQLite (compiles the amalgamation with FTS5 enabled) so we never
# depend on a system libsqlite3 and FTS5 is always present.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Content addressing for the blob store. A cryptographic digest is required:
# blob paths are dedupe keys and carry a `scan_state`, so a forgeable address
# would let colliding content inherit another blob's "clean" scan. No network,
# no default-off features needed.
blake3 = "1"
thiserror = "1"
serde_json = "1"
# RFC3339 timestamp parsing only (no networking/std feature creep).
time = { version = "0.3", features = ["parsing"] }
# Cross-platform watcher; default macOS backend is FSEvents.
notify = "8.2"
# Read-only local git inspection (gitoxide). default-features disabled so no
# network transport (blocking/async network clients) is ever compiled in — the
# archive core stays network-incapable. Only local repository reads are used.
# `revision` enables merge-base/ahead-behind commit-graph walking (pure local
# computation, no network).
gix = { version = "0.86", default-features = false, features = ["sha1", "status", "revision"] }

[dev-dependencies]
tempfile = "3"
# Property testing for pure input-sanitizing functions (adapters::common).
# default-features off drops the `fork`/`timeout` machinery (and its rusty-fork
# + wait-timeout deps): we only need the generator + shrinker, and a leaner dev
# tree keeps the egress dependency audit small.
proptest = { version = "1", default-features = false, features = ["std"] }
