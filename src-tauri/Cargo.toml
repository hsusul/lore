# Part of the root workspace. Note: unlike lore-core, the shell does NOT inherit
# the workspace `unsafe_code = "forbid"` lint — it links webview FFI. All archive
# logic stays in lore-core, which keeps that guarantee.
[package]
name = "lore-app"
description = "Lore desktop shell (Tauri 2). Thin binary over lore-core; no archive logic lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "lore_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary is named "Lore" (not the package name "lore-app") so the running
# process — and the macOS dock label in dev — reads "Lore". Kept in sync with
# `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "Lore"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lore-core = { path = "../crates/lore-core" }
lore-ipc = { path = "../crates/lore-ipc" }
# Same version as lore-core so the Connection type unifies (features are additive
# across the graph; lore-core already enables the bundled SQLite).
rusqlite = "0.32"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The updater is the sole network-capable component and is OFF by default
# (M0 requirement). Compiling it in requires explicitly enabling this feature.
updater = []
