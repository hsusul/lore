name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The heavy scale lane below runs only on these two triggers.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust core — fmt · clippy · test · network guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1 # pinned; keep in sync with rust-toolchain.toml
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain pin is consistent
        run: ./scripts/toolchain-pin-check.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy -p lore-core -p lore-ipc --all-targets --all-features -- -D warnings
      - name: Test (locked)
        run: cargo test --locked -p lore-core -p lore-ipc --all-targets
      - name: Network-boundary guard (call-site)
        run: cargo test -p lore-core --test no_network_in_archive
      - name: Egress guard (dependency graph + runtime network-deny)
        # REQUIRE_RUNTIME makes an unavailable sandbox wrapper a failure rather
        # than a silent skip: a green job must mean the runtime check actually
        # ran, not that it was quietly stepped over.
        env:
          LORE_EGRESS_REQUIRE_RUNTIME: "1"
        run: ./scripts/egress-check.sh
      - name: Generated IPC bindings are in sync
        run: |
          cargo test -p lore-ipc
          git diff --exit-code crates/lore-ipc/bindings

  ui:
    name: UI — lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  desktop-shell:
    # macOS is the only target we actually ship (see .github/workflows/release.yml),
    # so it must be built on every PR — not first exercised at tag time. Linux stays
    # in the matrix because it is the cheap lane and it keeps the non-macOS webview
    # path honest for the eventual Windows/Linux builds.
    name: Desktop shell — Tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms on a failure; a macOS-only break is the interesting
      # signal and fail-fast would hide it behind the faster Linux job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1 # pinned; keep in sync with rust-toolchain.toml
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf
      # macOS needs no equivalent: WebKit ships with the OS and the Xcode
      # command-line tools are preinstalled on the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build UI (frozen lockfile)
        run: |
          npm ci
          npm run build
      - name: Clippy the shell (deny warnings)
        run: cargo clippy -p lore-app --all-targets -- -D warnings
      - name: Build the shell
        run: cargo build --locked -p lore-app
      - name: Network-boundary guard (shell call-site)
        run: cargo test -p lore-app --test no_egress

  scale:
    # The ~1M-message search benchmark. Heavy (minutes), hardware-sensitive, and
    # not a per-PR gate — it exists to catch a super-linear regression, so it
    # runs weekly and on demand. The committed reference figures live in
    # docs/development/PERFORMANCE.md; the in-test assertion is only a generous
    # p95 < 1s sanity ceiling so this lane never goes flaky over hardware.
    name: Scale — FTS latency at ~1M messages
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1 # pinned; keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Search scale harness
        run: cargo test -p lore-core --release --test search_scale -- --ignored --nocapture
