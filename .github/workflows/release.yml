name: Release

# Build a downloadable macOS app and the `lorectl` command line. Triggered by
# pushing a version tag (e.g. v0.1.0), or manually from the Actions tab. The
# builds are UNSIGNED — no Apple Developer account is required — so first launch
# of the app needs a one-time right-click → Open (see the release notes below).
#
# `lorectl` is built for macOS arm64, macOS x86_64, and Linux x86_64. Each
# archive gets a `.sha256` file, and `SHA256SUMS` lists them all.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Read-only by default. Only the release job, which runs no project code and
# installs nothing, can write: `npm ci` runs package install scripts, and the
# build runs our code, so neither may hold a token that can push or edit
# releases.
permissions:
  contents: read

jobs:
  macos:
    name: macOS .dmg (unsigned, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1 # pinned; keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install JS dependencies
        run: npm ci
      # `tauri build` runs the beforeBuildCommand (npm run build) itself, then
      # compiles the Rust shell in release and bundles the .app + .dmg.
      - name: Build the app bundle
        run: npx tauri build
      - name: Upload the .dmg as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lore-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Attach the .dmg to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/attach to the GitHub Release on a tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lore-macos-dmg
          path: dmg
      - name: Attach the .dmg to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dmg/*.dmg
          generate_release_notes: true
          body: |
            **Unsigned macOS build (Apple Silicon).** Lore is not yet signed with
            an Apple Developer ID, so on first launch macOS will warn that it
            "cannot verify the developer".

            To open it the first time:
            1. Drag **Lore** to Applications.
            2. **Right-click** Lore → **Open**, then confirm **Open** in the dialog.
               (Or run: `xattr -dr com.apple.quarantine /Applications/Lore.app`.)

            After that it launches normally. Everything runs locally — Lore opens
            no network connections by default.

  lorectl:
    name: lorectl ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-built on the Apple Silicon runner; the SDK covers both.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1 # pinned; keep in sync with rust-toolchain.toml
        with:
          targets: ${{ matrix.target }}
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: lorectl-${{ matrix.target }}
      - name: Build lorectl
        run: cargo build --release --locked -p lorectl --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="lorectl-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/lorectl" README.md LICENSE "dist/${name}/"
          cd dist
          tar -czf "${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          cat "${name}.tar.gz.sha256"
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lorectl-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  lorectl-release:
    name: lorectl checksums and release assets
    needs: lorectl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lorectl-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS and verify every archive against it
        working-directory: dist
        run: |
          set -euo pipefail
          cat *.tar.gz.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Upload SHA256SUMS as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lorectl-SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Attach lorectl to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
